name: Scrape

on:
  # The schedule is intentionally disabled: scrape.yml is now triggered ONLY by
  # scheduler.yml (dynamic schedule from the Sheet `ajustes` tab) and by manual
  # workflow_dispatch. Do not re-enable a cron here (would double-run).
  #
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      etl_now:
        description: >-
          Test aid: ISO8601 timestamp with offset used to classify publication
          windows (e.g. 2026-10-22T16:00:00-05:00). Empty in production.
        required: false
        default: ""
      etl_force_fail:
        description: >-
          Test aid: comma-separated slugs forced to fail (e.g.
          dolar_oficial_manana). Empty in production.
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Healthchecks.io ping URL (full UUID). Created by the owner; missing secret
  # disables alerting gracefully (warning in logs, ETL keeps running).
  HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        id: install
        run: pip install .

      - name: Healthchecks start ping
        run: python scripts/hc_ping.py start

      - name: Detect browser sources
        id: browser
        run: |
          if python - <<'PY'
          import sys, yaml
          cfg = yaml.safe_load(open("config/indicators.yaml", encoding="utf-8"))
          sys.exit(0 if any(s.get("method") == "browser" for s in cfg["sources"].values()) else 1)
          PY
          then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Chromium (browser sources only)
        id: browser_install
        if: steps.browser.outputs.needed == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run ETL
        id: etl
        env:
          ETL_NOW: ${{ inputs.etl_now }}
          ETL_FORCE_FAIL: ${{ inputs.etl_force_fail }}
        run: |
          args=()
          if [ -n "$ETL_NOW" ]; then
            args+=(--now "$ETL_NOW")
          fi
          if [ -n "$ETL_FORCE_FAIL" ]; then
            args+=(--force-fail "$ETL_FORCE_FAIL")
          fi
          python scripts/run_etl.py "${args[@]}"

      # Runs when the ETL step succeeded: /fail only for unexpected failures
      # (forward-fill inside the indicator's publication_window), /success when
      # every forward-fill is expected (outside its window) or there are none.
      # Expected forward-fills and stale warnings appear as warnings in the
      # success body.
      - name: Healthchecks report ping
        run: python scripts/hc_ping.py report

      - name: Upload raw artifacts (HTML + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-artifacts-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and push data
        id: commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes to commit"
            exit 0
          fi
          git commit -m "chore(data): indicators run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1

      - name: Smoke validate ETL run report (18/18 presence)
        id: smoke
        run: python scripts/test_live.py

      - name: Healthchecks crash ping
        if: failure()
        run: |
          FAILED="unknown"
          for pair in \
            "install:${{ steps.install.outcome }}" \
            "playwright:${{ steps.browser_install.outcome }}" \
            "etl:${{ steps.etl.outcome }}" \
            "commit:${{ steps.commit.outcome }}" \
            "smoke:${{ steps.smoke.outcome }}"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "$outcome" = "failure" ]; then
              FAILED="$name"
            fi
          done
          python scripts/hc_ping.py crash --step "$FAILED"

  pages:
    # Deploy the static contract in the SAME run. `workflow_run` does not fire
    # for scrapes dispatched by the scheduler with GITHUB_TOKEN, so Pages is
    # called as a reusable workflow after a successful scrape (data committed).
    needs: scrape
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
