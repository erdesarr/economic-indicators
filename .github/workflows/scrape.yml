name: Scrape

on:
  # Schedule ACTIVE since 2026-10-08 after the owner approved the 18/18 live
  # run and the Healthchecks pings (see docs/APPROVALS.md).
  schedule:
    # 0 2 * * * UTC = 21:00 America/Bogota.
    # Colombia does not observe DST, so the local time is stable all year.
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Healthchecks.io ping URL (full UUID). Created by the owner; missing secret
  # disables alerting gracefully (warning in logs, ETL keeps running).
  HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        id: install
        run: pip install .

      - name: Healthchecks start ping
        run: python scripts/hc_ping.py start

      - name: Detect browser sources
        id: browser
        run: |
          if python - <<'PY'
          import sys, yaml
          cfg = yaml.safe_load(open("config/indicators.yaml", encoding="utf-8"))
          sys.exit(0 if any(s.get("method") == "browser" for s in cfg["sources"].values()) else 1)
          PY
          then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Chromium (browser sources only)
        id: browser_install
        if: steps.browser.outputs.needed == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run ETL
        id: etl
        run: python scripts/run_etl.py

      # Runs when the ETL step succeeded: /fail if failures > 0 (forward-fill
      # applied), /success otherwise. Stale warnings without failures are a
      # SUCCESS ping with the warning in the body.
      - name: Healthchecks report ping
        run: python scripts/hc_ping.py report

      - name: Upload raw artifacts (HTML + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-artifacts-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and push data
        id: commit
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes to commit"
            exit 0
          fi
          git commit -m "chore(data): indicators run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1

      - name: Live smoke test (18/18, in-range, coherent units)
        id: smoke
        run: python scripts/test_live.py

      - name: Healthchecks crash ping
        if: failure()
        run: |
          FAILED="unknown"
          for pair in \
            "install:${{ steps.install.outcome }}" \
            "playwright:${{ steps.browser_install.outcome }}" \
            "etl:${{ steps.etl.outcome }}" \
            "commit:${{ steps.commit.outcome }}" \
            "smoke:${{ steps.smoke.outcome }}"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "$outcome" = "failure" ]; then
              FAILED="$name"
            fi
          done
          python scripts/hc_ping.py crash --step "$FAILED"
