name: Scrape

on:
  # SCHEDULE PROHIBITED until the owner approves a full `make validate`
  # (18/18 live) and a manual workflow_dispatch run. Do not uncomment.
  #
  # schedule:
  #   # 0 2 * * * UTC = 21:00 America/Bogota.
  #   # Colombia does not observe DST, so the local time is stable all year.
  #   - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Detect browser sources
        id: browser
        run: |
          if python - <<'PY'
          import sys, yaml
          cfg = yaml.safe_load(open("config/indicators.yaml", encoding="utf-8"))
          sys.exit(0 if any(s.get("method") == "browser" for s in cfg["sources"].values()) else 1)
          PY
          then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Chromium (browser sources only)
        if: steps.browser.outputs.needed == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run ETL
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/run_etl.py

      - name: Upload raw artifacts (HTML + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-artifacts-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and push data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes to commit"
            exit 0
          fi
          git commit -m "chore(data): indicators run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1

      - name: Live smoke test (17/18 until MANANA is verified live)
        continue-on-error: true
        run: python scripts/test_live.py
