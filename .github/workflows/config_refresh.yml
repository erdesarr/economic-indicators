name: Config refresh

on:
  # PRIMARY PATH for sheet edits: the container-bound Apps Script onChange
  # dispatches this workflow. It syncs the live tabs and immediately refreshes
  # the form in write mode with all existing safeguards (golden records,
  # freshness, threshold guard, post-write verification, Healthchecks pings).
  #
  # GitHub's 6 h sync_config.yml schedule remains the safety net. The script
  # does not decide anything; it only dispatches.
  workflow_dispatch:

concurrency:
  # Same group as form_update.yml: never write the form concurrently with the
  # scheduler-triggered updater.
  group: form-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORM_URL: ${{ secrets.FORM_URL }}
  HEALTHCHECKS_URL_SYNC: ${{ secrets.HEALTHCHECKS_URL_SYNC }}
  HEALTHCHECKS_URL_FORM_UPDATER: ${{ secrets.HEALTHCHECKS_URL_FORM_UPDATER }}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Sync public sheet into config/sheet_config.csv
        run: python scripts/sync_config.py

      - name: Commit and push snapshot
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sheet_config.csv
          if git diff --cached --quiet; then
            echo "no snapshot changes to commit"
            exit 0
          fi
          git commit -m "chore(config): refresh sheet snapshot ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1

      - name: Run form updater (write)
        run: python scripts/run_form_updater.py --mode write --origin forced

      - name: Commit form updater write state
        if: ${{ always() }}
        run: |
          set -e
          if [ ! -f config/form_update_state.json ]; then
            echo "no state file"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/form_update_state.json
          if git diff --cached --quiet; then
            echo "no state changes"
            exit 0
          fi
          git commit -m "chore(webform): refresh write state ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1

      - name: Upload form screenshots (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-refresh-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
