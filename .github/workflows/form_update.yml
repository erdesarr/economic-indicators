name: Form update

on:
  # SCHEDULE GATED (gate 13): the scheduler will dispatch this workflow once the
  # owner activates it. No cron here.
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run | write | capture"
        type: choice
        options: [dry-run, write, capture, probe]
        default: dry-run
      slugs:
        description: "Optional comma-separated record ids/slugs (test subset)"
        required: false
        default: ""
      origin:
        description: "Trigger origin: natural (scheduler) or forced (manual/test)"
        type: choice
        options: [forced, natural]
        default: forced
  workflow_call:
    inputs:
      mode:
        type: string
        required: false
        default: dry-run
      slugs:
        type: string
        required: false
        default: ""
      origin:
        type: string
        required: false
        default: forced

concurrency:
  group: form-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORM_URL: ${{ secrets.FORM_URL }}
  HEALTHCHECKS_URL_FORM_UPDATER: ${{ secrets.HEALTHCHECKS_URL_FORM_UPDATER }}

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run form updater
        run: |
          ARGS="--mode ${{ inputs.mode }} --origin ${{ inputs.origin }}"
          if [ -n "${{ inputs.slugs }}" ]; then
            ARGS="$ARGS --slugs ${{ inputs.slugs }}"
          fi
          echo "python scripts/run_form_updater.py $ARGS"
          python scripts/run_form_updater.py $ARGS

      - name: Commit form update write state (write mode)
        if: ${{ always() && inputs.mode == 'write' }}
        run: |
          set -e
          if [ ! -f config/form_update_state.json ]; then
            echo "no state file"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/form_update_state.json
          if git diff --cached --quiet; then
            echo "no state changes"
            exit 0
          fi
          git commit -m "chore(webform): write state ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1

      - name: Upload form screenshots (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-updater-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit captured golden records (capture mode only)
        if: ${{ inputs.mode == 'capture' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden/webform/records.json
          if git diff --cached --quiet; then
            echo "no records changes to commit"
            exit 0
          fi
          git commit -m "chore(webform): capture golden record names ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
