name: Scheduler

on:
  # ACTIVE since 2026-10-16 after the owner-approved end-to-end chain
  # (scheduler -> scrape 18/18 -> scheduler -> form-updater 18 writes).
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Test aid: trigger a workflow regardless of the window"
        type: choice
        options: [none, etl, updater]
        default: none
      now:
        description: "Test aid: override current UTC time (ISO8601)"
        required: false
        default: ""

concurrency:
  group: scheduler
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

env:
  HEALTHCHECKS_URL_SCHEDULER: ${{ secrets.HEALTHCHECKS_URL_SCHEDULER }}
  HEALTHCHECKS_URL_SYNC: ${{ secrets.HEALTHCHECKS_URL_SYNC }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Run scheduler
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" != "" ] && [ "${{ inputs.force }}" != "none" ]; then
            ARGS="$ARGS --force ${{ inputs.force }}"
          fi
          if [ -n "${{ inputs.now }}" ]; then
            ARGS="$ARGS --now '${{ inputs.now }}'"
          fi
          echo "python scripts/scheduler.py $ARGS"
          eval python scripts/scheduler.py $ARGS
