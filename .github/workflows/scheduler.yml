name: Scheduler

on:
  # ACTIVE. GitHub throttles high-frequency crons (observed runs every 2-5 h),
  # so the scheduler uses a catch-up horizon + state dedup and chains the ETL
  # into the updater sequentially (see src/form_updater/scheduler.py).
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Test aid: trigger a workflow regardless of the window"
        type: choice
        options: [none, etl, updater]
        default: none
      now:
        description: "Test aid: override current UTC time (ISO8601)"
        required: false
        default: ""

concurrency:
  group: scheduler
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  HEALTHCHECKS_URL_SCHEDULER: ${{ secrets.HEALTHCHECKS_URL_SCHEDULER }}
  HEALTHCHECKS_URL_SYNC: ${{ secrets.HEALTHCHECKS_URL_SYNC }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}

jobs:
  scheduler:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The state file is committed by previous scheduler runs; scheduled
          # events may carry an older SHA, so fetch the current branch tip.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Run scheduler
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" != "" ] && [ "${{ inputs.force }}" != "none" ]; then
            ARGS="$ARGS --force ${{ inputs.force }}"
          fi
          if [ -n "${{ inputs.now }}" ]; then
            ARGS="$ARGS --now '${{ inputs.now }}'"
          fi
          echo "python scripts/scheduler.py $ARGS"
          eval python scripts/scheduler.py $ARGS

      - name: Commit scheduler state
        if: always()
        run: |
          set -e
          if [ ! -f config/scheduler_state.json ]; then
            echo "no state file"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/scheduler_state.json
          if git diff --cached --quiet; then
            echo "no state changes"
            exit 0
          fi
          git commit -m "chore(scheduler): trigger state ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
