    unit_published: COP
    plausible_range: [2897.0, 3541.0]
    stale_check: true
    # Capturado y aprobado en vivo el 2026-10-08 (run 37846703655);
    # el golden real reemplazó al sintético. Bloque gemelo de `trm-today`,
